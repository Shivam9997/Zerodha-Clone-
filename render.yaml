services:
  # ── 1. Backend (Express API) ──────────────────────────────────────────────
  - type: web
    name: zerodha-backend
    env: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false          # set manually in Render dashboard
      - key: TOKEN_KEY
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # comma-separated deployed frontend URLs

  # ── 2. Dashboard (React trading app) ─────────────────────────────────────
  - type: web
    name: zerodha-dashboard
    env: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # e.g. https://zerodha-backend.onrender.com

  # ── 3. Frontend (Landing page) ────────────────────────────────────────────
  - type: web
    name: zerodha-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # e.g. https://zerodha-backend.onrender.com
      - key: VITE_DASHBOARD_URL
        sync: false          # e.g. https://zerodha-dashboard.onrender.com
